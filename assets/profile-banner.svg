<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Amiga Meow — Product Engineer and Open Source Builder</title>
  <desc id="desc">A restrained text-only profile banner.</desc>
  <style>
    .bg{fill:#f5f2e9}.panel{fill:#ece7da}.ink{fill:#1b365d}.muted{fill:#6c6459}.line{stroke:#a79d8d;stroke-width:1}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.label{letter-spacing:3px}
    @media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#151b23}.ink{fill:#dce7f5}.muted{fill:#9aa7b7}.line{stroke:#52647a}}
  </style>
  <rect class="bg" width="1200" height="220" rx="20"/>
  <rect class="panel" x="28" y="28" width="1144" height="164" rx="16"/>
  <text class="serif ink" x="64" y="96" font-size="58" font-weight="600">Amiga Meow</text>
  <text class="sans ink label" x="66" y="130" font-size="14">PRODUCT ENGINEER · OPEN SOURCE BUILDER</text>
  <line class="line" x1="66" y1="150" x2="1134" y2="150"/>
  <text class="sans muted" x="66" y="176" font-size="15">Practical AI products · self-hosted systems · maintainable open-source tools</text>
