<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Amiga Meow — AI Product Engineer and Open Source Builder</title>
  <desc id="desc">A responsive editorial banner with a geometric AM mark and diagrams for AI, infrastructure, and knowledge systems.</desc>
  <style>
    .bg{fill:#f5f2e9}.panel{fill:#ece7da}.ink{fill:#1b365d}.muted{fill:#6c6459}.line{fill:none;stroke:#1b365d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#a79d8d;stroke-width:1}.grid{fill:none;stroke:#cfc7b9;stroke-width:1}.node{fill:#1b365d}.accent{fill:#9b7438}.label{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:3px}.serif{font-family:Georgia,"Times New Roman",serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#151b23}.ink{fill:#dce7f5}.muted{fill:#9aa7b7}.line{stroke:#dce7f5}.fine{stroke:#52647a}.grid{stroke:#263345}.node{fill:#dce7f5}.accent{fill:#c7a261}}
  </style>
