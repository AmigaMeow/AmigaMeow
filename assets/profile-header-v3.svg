<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">AmigaMeow — Independent Developer and Open-Source Maintainer</title>
  <desc id="desc">A restrained text-only profile header focused on open source, self-hosted systems, local inference, and knowledge tools.</desc>
  <style>
    .bg{fill:#f5f2e9}.ink{fill:#1b365d}.muted{fill:#6c6459}.rule{stroke:#b8afa1;stroke-width:1}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.caps{letter-spacing:3px}
    @media (prefers-color-scheme:dark){.bg{fill:#0d1117}.ink{fill:#dce7f5}.muted{fill:#9aa7b7}.rule{stroke:#344458}}
  </style>
  <rect class="bg" width="1200" height="190" rx="18"/>
  <line class="rule" x1="64" y1="30" x2="1136" y2="30"/>
  <text class="serif ink" x="600" y="88" text-anchor="middle" font-size="56" font-weight="600">AmigaMeow</text>
  <text class="sans ink caps" x="600" y="122" text-anchor="middle" font-size="14">INDEPENDENT DEVELOPER · OPEN-SOURCE MAINTAINER</text>
  <text class="sans muted caps" x="600" y="150" text-anchor="middle" font-size="12">SELF-HOSTED SYSTEMS · LOCAL INFERENCE · KNOWLEDGE TOOLS</text>
  <line class="rule" x1="64" y1="166" x2="1136" y2="166"/>
</svg>
